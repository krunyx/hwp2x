name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]  # a release created on github.com or via the API builds and attaches assets

permissions:
  contents: write  # attach release assets on tags

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: macos-14,       name: macos-arm64 }   # Apple silicon
          - { os: macos-15-intel, name: macos-x64 }    # Intel
          - { os: ubuntu-22.04,   name: linux-x64 }     # older glibc = wider compatibility
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Linux libraries Qt needs at test time
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 fonts-noto-cjk

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Build engine and bundled Java runtime
        run: python scripts/build_engine.py

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build app
        run: pyinstaller packaging/hwp2x.spec --noconfirm --distpath dist --workpath build/pyi

      - name: Smoke test the built program (Korean path, bundled Java)
        run: |
          mkdir -p "smoke/한글 폴더"
          cp "build/engine/upstream/hwplib/sample_hwp/basic/표.hwp" "smoke/한글 폴더/보고서 표.hwp"
          case "$RUNNER_OS" in
            Windows) CLI=dist/hwp2x/hwp2x.exe ;;
            macOS)   CLI=dist/hwp2x.app/Contents/MacOS/hwp2x ;;
            *)       CLI=dist/hwp2x/hwp2x ;;
          esac
          # -r: the sample sits in a sub-folder. On failure, surface the output as an
          # annotation so it is visible without downloading the job log.
          if ! "$CLI" smoke -r > smoke.log 2>&1; then
            cat smoke.log
            echo "::error title=smoke test::$(tail -n 5 smoke.log | tr '\n' ' ')"
            exit 1
          fi
          cat smoke.log
          python -c "import sys; sys.path.insert(0,'src'); from hwp2x import check_hwpx; p=check_hwpx('smoke/한글 폴더/보고서 표.hwpx'); print(p); sys.exit(1 if p else 0)"
          # the other formats go through the bundled reader/writers (and Pillow)
          cp "build/engine/upstream/hwplib/sample_hwp/basic/그림.hwp" "smoke/한글 폴더/그림.hwp"
          for t in docx md html tex htex; do
            "$CLI" smoke -r -t $t -f >> smoke.log 2>&1 || { cat smoke.log; echo "::error title=smoke test::format $t failed"; exit 1; }
          done
          ls -R smoke
          test -s "smoke/한글 폴더/보고서 표.docx" && test -s "smoke/한글 폴더/그림.md" && test -d "smoke/한글 폴더/그림_files"
          python -c "import sys; sys.path.insert(0,'src'); from hwp2x.verify import check_docx; p=check_docx('smoke/한글 폴더/보고서 표.docx'); print(p); sys.exit(1 if p else 0)"
          # version, copyright and icon where each OS shows them
          "$CLI" --version | tee ver.txt; grep -q krunyx ver.txt
          VER=$(python -c "import sys; sys.path.insert(0,'src'); import hwp2x; print(hwp2x.__version__)")
          case "$RUNNER_OS" in
            Windows)
              powershell -NoProfile -Command "\$v=(Get-Item dist/hwp2x/hwp2x-gui.exe).VersionInfo; \$v | Format-List CompanyName,ProductName,ProductVersion,LegalCopyright; if (\$v.CompanyName -ne 'krunyx' -or \$v.ProductVersion -ne '$VER') { exit 1 }" ;;
            macOS)
              P=dist/hwp2x.app/Contents/Info.plist
              /usr/libexec/PlistBuddy -c "Print NSHumanReadableCopyright" $P | grep krunyx
              test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' $P)" = "$VER"
              test -s "dist/hwp2x.app/Contents/Resources/$(/usr/libexec/PlistBuddy -c 'Print CFBundleIconFile' $P)" ;;
            *)
              test -s dist/hwp2x/_internal/hwp2x/assets/icon-256.png ;;
          esac

      - name: Package
        run: |
          mkdir -p out
          V="${GITHUB_REF_NAME#v}"; [[ "$GITHUB_REF" == refs/tags/* ]] || V=dev
          case "$RUNNER_OS" in
            Windows)
              cp LICENSE NOTICE dist/hwp2x/
              7z a -tzip "out/hwp2x-$V-${{ matrix.name }}.zip" ./dist/hwp2x/* >/dev/null ;;
            macOS)
              codesign --force --deep --sign - dist/hwp2x.app   # ad-hoc signature (required on Apple silicon)
              # hdiutil sometimes fails with "Resource busy" on hosted runners: retry
              for n in 1 2 3 4 5; do
                hdiutil create -volname hwp2x -srcfolder dist/hwp2x.app -ov -format UDZO \
                  "out/hwp2x-$V-${{ matrix.name }}.dmg" && break
                [ $n = 5 ] && exit 1
                echo "hdiutil failed (attempt $n), retrying"; sleep $((n * 10))
              done ;;
            *)
              cp LICENSE NOTICE packaging/linux/hwp2x.desktop packaging/linux/install.sh packaging/icons/hwp2x-512.png dist/hwp2x/
              tar -C dist -czf "out/hwp2x-$V-${{ matrix.name }}.tar.gz" hwp2x ;;
          esac
          ls -lh out

      - uses: actions/upload-artifact@v5
        with:
          name: hwp2x-${{ matrix.name }}
          path: out/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: hwp2x ${{ github.ref_name }}
          body_path: packaging/RELEASE_NOTES.md
          files: out/*
