[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hwp2x"
version = "0.1.0"
description = "Convert HWP documents to HWPX on Windows, macOS and Linux"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.6"]
dev = ["pytest>=7", "pyinstaller>=6.6", "PySide6-Essentials>=6.6"]

[project.scripts]
hwp2x = "hwp2x.cli:main"

[project.gui-scripts]
hwp2x-gui = "hwp2x.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The jar is portable. The bundled Java runtime is platform specific and is
# shipped only in the standalone app builds (see packaging/hwp2x.spec);
# a pip install uses the system Java instead.
hwp2x = ["_engine/hwp2x-engine.jar", "_engine/NOTICE.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
